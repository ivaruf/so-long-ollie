<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Gopher Run</title>
  <meta name="description" content="A little gopher, a meadow, a cloud to ride, and a message up in the sky.">
  <meta name="theme-color" content="#62a24a">
  <meta property="og:title" content="Gopher Run">
  <meta property="og:description" content="Jump twice to ride the cloud. Something is waiting up there.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 100 100%27%3E%3Ctext y=%27.9em%27 font-size=%2790%27%3E%E2%98%81%EF%B8%8F%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <canvas id="renderCanvas" tabindex="0"></canvas>

  <div id="hud" aria-label="Controls">
    <div class="hud-title">gopher <span id="mode" class="mode">loading</span></div>
    <ul>
      <li><kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> / arrows&nbsp; move</li>
      <li><kbd>Space</kbd>&nbsp; jump &middot; again in the air&nbsp; <em>cloud!</em></li>
      <li><kbd>Shift</kbd>&nbsp; sprint</li>
      <li class="hud-sub">on the cloud: hold <kbd>Space</kbd> rise &middot; <kbd>Shift</kbd> sink &middot; touch down to land</li>
      <li>drag&nbsp; orbit &middot; wheel&nbsp; zoom</li>
    </ul>
    <div id="status" hidden></div>
  </div>

  <div id="loading">Loading&hellip;</div>

  <!-- Pinned so the page keeps working as Babylon.js moves on. -->
  <script src="https://cdn.jsdelivr.net/npm/babylonjs@9.25.0/babylon.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/babylonjs-loaders@9.25.0/babylonjs.loaders.min.js"></script>
  <script src="gopher-model.js"></script>
  <script src="world.js"></script>
  <script src="game.js"></script>
</body>
</html>

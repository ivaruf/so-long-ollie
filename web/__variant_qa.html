<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Scarf gopher QA</title>
  <style>
    html,body,#canvas{width:100%;height:100%;margin:0;overflow:hidden;background:#aeb9c7}
    #label{position:fixed;top:16px;left:18px;padding:8px 12px;border-radius:999px;background:#10151dcc;color:#fff;font:600 14px system-ui}
  </style>
</head>
<body>
  <canvas id="canvas"></canvas><div id="label">Loading…</div>
  <script src="https://cdn.babylonjs.com/babylon.js"></script>
  <script src="https://cdn.babylonjs.com/loaders/babylonjs.loaders.min.js"></script>
  <script>
    (async () => {
      const variant = new URLSearchParams(location.search).get('variant') === 'cloud' ? 'cloud' : 'plain';
      const canvas = document.getElementById('canvas');
      const engine = new BABYLON.Engine(canvas, true, {preserveDrawingBuffer:true});
      const scene = new BABYLON.Scene(engine);
      scene.clearColor = BABYLON.Color4.FromHexString('#aeb9c7ff');
      scene.environmentIntensity = 0.7;
      const targetHeight = variant === 'cloud' ? 0.68 : 0.54;
      const camera = new BABYLON.ArcRotateCamera('camera', Math.PI/2 + 0.42, 1.17, variant === 'cloud' ? 3.15 : 2.65, new BABYLON.Vector3(0.08,targetHeight,0), scene);
      camera.lowerRadiusLimit = 1.7; camera.upperRadiusLimit = 6; camera.attachControl(canvas,true);
      const hemi = new BABYLON.HemisphericLight('hemi',new BABYLON.Vector3(-0.3,1,0.4),scene); hemi.intensity=1.3; hemi.groundColor=new BABYLON.Color3(.25,.28,.33);
      const sun = new BABYLON.DirectionalLight('sun',new BABYLON.Vector3(-.6,-1,-.45),scene); sun.position=new BABYLON.Vector3(3,6,4); sun.intensity=1.4;
      const ground = BABYLON.MeshBuilder.CreateGround('ground',{width:8,height:8},scene);
      const gm = new BABYLON.PBRMaterial('groundMat',scene); gm.albedoColor=BABYLON.Color3.FromHexString('#c8d0d9'); gm.roughness=1; ground.material=gm;
      const shadows = new BABYLON.ShadowGenerator(1024,sun); shadows.useBlurExponentialShadowMap=true; shadows.blurKernel=24; ground.receiveShadows=true;
      const file = variant === 'cloud' ? 'gopher-scarf-cloud.glb' : 'gopher-scarf.glb';
      const result = await BABYLON.SceneLoader.ImportMeshAsync('', '../assets/', file, scene);
      result.meshes.forEach(m => { if (m.getTotalVertices && m.getTotalVertices()) shadows.addShadowCaster(m); });
      document.getElementById('label').textContent = variant === 'cloud' ? 'Scarf gopher — cloud mode' : 'Scarf gopher — no cloud';
      engine.runRenderLoop(()=>scene.render()); addEventListener('resize',()=>engine.resize());
    })().catch(error => document.getElementById('label').textContent = error.message);
  </script>
</body>
</html>
